<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>不新手老师</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="shell">

  <header class="bar">
    <button class="mark" id="toHome"><img class="brand-logo" src="/logo.png" alt="" /><span>不新手老师</span></button>
    <nav class="global" id="globalNav">
      <button data-nav="home">首页</button>
      <button data-nav="library">课程库</button>
      <button data-nav="inbox">待整理</button>
      <button data-nav="kb">知识库</button>
    </nav>
    <div class="device-status" id="deviceStatus" role="status">模拟器状态：检查中</div>
    <div class="device-status" id="asrStatus" role="status">语音识别：检查中</div>
    <div class="conn" id="conn"></div>
  </header>

  <div class="view" id="view"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" id="dialog"></div>
</div>

<input type="file" id="filePicker" multiple hidden />

<script src="/app.js"></script>
</body>
</html>
