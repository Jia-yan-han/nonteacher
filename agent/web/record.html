<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>录音 · 不新手老师</title>
<style>
  :root{
    --paper:#f1f3ef; --page:#fff; --ink:#14181a; --ink-2:#4a524d; --ink-3:#79817b;
    --rule:#ccd4cb; --rule-2:#e4e9e3; --green:#24533d; --green-d:#17392a; --red:#9d2f24;
    --sans:"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"Cascadia Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font:400 16px/1.7 var(--sans);display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:620px;background:var(--page);border:1.5px solid var(--rule);
    border-radius:16px;padding:32px 34px;box-shadow:0 8px 30px rgba(20,24,26,.08);}
  h1{font-size:24px;margin:0 0 6px;font-weight:700;}
  p.lead{color:var(--ink-2);font-size:15px;margin:0 0 26px;line-height:1.8;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:6px;}
  input{width:100%;border:1.5px solid var(--rule);border-radius:9px;padding:11px 14px;
    font:inherit;font-size:15px;outline:none;margin-bottom:18px;background:var(--page);}
  input:focus{border-color:var(--green);}
  .meter{height:12px;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;
    margin-bottom:10px;background:var(--paper);}
  .meter i{display:block;height:100%;width:0;background:var(--green);transition:width .06s linear;}
  .clock{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:.04em;
    text-align:center;margin:14px 0 6px;font-variant-numeric:tabular-nums;}
  .hint{font-size:13px;color:var(--ink-3);text-align:center;margin-bottom:24px;min-height:22px;}
  .acts{display:flex;gap:12px;}
  button{font:inherit;font-size:15px;cursor:pointer;border-radius:10px;padding:13px 22px;}
  .primary{flex:1;border:0;background:var(--green);color:#fff;font-weight:600;}
  .primary:hover{background:var(--green-d);}
  .primary.rec{background:var(--red);}
  .quiet{border:1.5px solid var(--rule);background:var(--page);color:var(--ink-2);}
  .quiet:hover{border-color:var(--green);color:var(--green);}
  .quiet:disabled,.primary:disabled{opacity:.45;cursor:default;}
  .done{margin-top:22px;padding:14px 16px;border-radius:10px;background:#e1ece5;
    border:1px solid #c9dbd1;font-size:14px;line-height:1.7;word-break:break-all;}
  .warn{margin-top:18px;font-size:13px;color:var(--ink-3);line-height:1.8;
    border-top:1px solid var(--rule-2);padding-top:16px;}
  .warn b{color:var(--red);font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <h1>录音</h1>
  <p class="lead">直接用浏览器录，录完就是 WAV，落在项目的 <code>samples/audio/</code> 里。不用装软件，不用传文件。</p>

  <label for="name">文件名</label>
  <input id="name" value="课堂-三角形的三边关系-电脑麦克风" />

  <div class="meter"><i id="bar"></i></div>
  <div class="clock" id="clock">00:00</div>
  <div class="hint" id="hint">点「开始录音」，浏览器会问一次麦克风权限</div>

  <div class="acts">
    <button class="primary" id="rec">开始录音</button>
    <button class="quiet" id="save" disabled>保存</button>
  </div>

  <div id="done"></div>

  <div class="warn">
    录之前：<b>先静 5 秒</b>（后期降噪要用），嘴离麦克风 15–20 厘米偏一点角度。
    念错了只重念那一句，别整段重来。
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let ctx = null, stream = null, source = null, node = null;
let chunks = [], total = 0, recording = false, startedAt = 0, timer = null, wavBlob = null;

function fmt(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

async function start() {
  $("#done").innerHTML = "";
  wavBlob = null;
  $("#save").disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: false }
    });
  } catch (e) {
    $("#hint").textContent = "拿不到麦克风：" + e.message;
    return;
  }
  ctx = new AudioContext({ sampleRate: 48000 });
  await ctx.resume();
  source = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  chunks = []; total = 0;

  node.onaudioprocess = ev => {
    if (!recording) return;
    const buf = ev.inputBuffer.getChannelData(0);
    chunks.push(new Float32Array(buf));
    total += buf.length;
    let peak = 0;
    for (let i = 0; i < buf.length; i += 16) peak = Math.max(peak, Math.abs(buf[i]));
    $("#bar").style.width = Math.min(100, peak * 140) + "%";
  };
  source.connect(node);
  node.connect(ctx.destination);

  recording = true;
  startedAt = Date.now();
  $("#rec").textContent = "停止";
  $("#rec").classList.add("rec");
  $("#hint").textContent = "正在录 · 采样率 " + ctx.sampleRate + " Hz 单声道";
  timer = setInterval(() => { $("#clock").textContent = fmt((Date.now() - startedAt) / 1000); }, 200);
}

function stop() {
  recording = false;
  clearInterval(timer);
  $("#rec").textContent = "开始录音";
  $("#rec").classList.remove("rec");
  $("#bar").style.width = "0%";
  try { node.disconnect(); source.disconnect(); } catch (e) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (!total) { $("#hint").textContent = "没录到声音，再试一次"; return; }

  const merged = new Float32Array(total);
  let off = 0;
  for (const c of chunks) { merged.set(c, off); off += c.length; }
  wavBlob = encodeWav(merged, ctx.sampleRate);
  $("#hint").textContent = "录完了 · " + fmt(total / ctx.sampleRate) + " · " + (wavBlob.size / 1048576).toFixed(1) + " MB";
  $("#save").disabled = false;
}

/** Float32 → 16bit PCM WAV */
function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

async function save() {
  if (!wavBlob) return;
  const btn = $("#save");
  btn.disabled = true; btn.textContent = "正在保存…";
  const reader = new FileReader();
  reader.onload = async () => {
    const b64 = String(reader.result).slice(String(reader.result).indexOf(",") + 1);
    try {
      const r = await fetch("/api/audio/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: $("#name").value.trim() || "未命名", data: b64 })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
      $("#done").innerHTML = `<div class="done">已保存：<b>${d.path}</b><br>${(d.bytes / 1048576).toFixed(1)} MB · ${d.seconds} 秒 · ${d.rate} Hz</div>`;
    } catch (e) {
      $("#done").innerHTML = `<div class="done" style="background:#f8e9e6;border-color:#e7c9c3">保存失败：${e.message}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = "保存";
    }
  };
  reader.readAsDataURL(wavBlob);
}

$("#rec").onclick = () => { recording ? stop() : start(); };
$("#save").onclick = save;
</script>
</body>
</html>
